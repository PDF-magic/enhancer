name: PDF metadata and preserved-text regressions

on:
  push:
    branches: [snails]
  pull_request:
    paths:
      - "pdf_metadata.py"
      - "tag-ocr-pdf.py"
      - "tests/test_pdf_metadata.py"
      - "tests/test_tag_existing_text.py"
      - ".github/workflows/pdf-regressions.yml"

jobs:
  metadata-and-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression dependencies
        run: python -m pip install pikepdf pdfminer.six
      - name: Run metadata and tagged PDF tests
        run: python -m unittest discover -s tests -p 'test_pdf_metadata.py' -v && python -m unittest discover -s tests -p 'test_tag_existing_text.py' -v
